styles:
  marker:
    r: 5
    stroke: '#f2f2f2'
    fill: '#0ea5e9'
    lineWidth: 2
    font: 12px monospace
    color: '#f2f2f2'
  route:
    stroke: '#fbbf24'
    lineWidth: 2
    r: 3
    fill: '#fbbf24'
  obstacle:
    stroke: '#e11d48'
    fill: rgba(225,29,72,0.2)
    lineWidth: 2
  gasNode:
    stroke: '#22c55e'
    lineWidth: 2

markers:
  - id: marker-start
    x: -650
    y: 500
    label: Start
  - id: marker-station-a
    x: -500
    y: 200
    label: Station A
  - id: marker-rupture
    x: 0
    y: 0
    label: Rupture Point
  - id: marker-station-b
    x: 500
    y: -200
    label: Station B
  - id: marker-valve1
    x: -250
    y: 100
    label: Valve 1
  - id: marker-valve2
    x: 250
    y: -100
    label: Valve 2
  - id: marker-access
    x: -650
    y: 300
    label: Access Road

routes:
  # Survey route - approaches from safe distance, circles the rupture
  - id: route-survey
    points:
      - {x: -600, y: 450}
      - {x: -450, y: 350}
      - {x: -300, y: 250}
      - {x: -150, y: 150}
      - {x: 0, y: 200}
      - {x: 150, y: 150}
      - {x: 300, y: 50}
      - {x: 400, y: -100}
      - {x: 450, y: -250}
      - {x: 350, y: -350}
      - {x: 150, y: -300}
      - {x: -50, y: -250}
      - {x: -200, y: -150}
      - {x: -350, y: -50}
      - {x: -450, y: 100}

obstacles:
  # === Main pipeline sections (running diagonally) ===
  # Western section - before rupture
  - id: obstacle-pipe-w1
    x: -550
    y: 225
    w: 300
    h: 15
    angle: -0.4
  - id: obstacle-pipe-w2
    x: -300
    y: 112
    w: 300
    h: 15
    angle: -0.4
  - id: obstacle-pipe-w3
    x: -100
    y: 25
    w: 120
    h: 15
    angle: -0.4

  # Ruptured section - displaced and broken
  - id: obstacle-pipe-rupt1
    x: -20
    y: -15
    w: 60
    h: 15
    angle: -0.6
  - id: obstacle-pipe-rupt2
    x: 30
    y: -30
    w: 50
    h: 15
    angle: -0.2

  # Eastern section - after rupture
  - id: obstacle-pipe-e1
    x: 100
    y: -50
    w: 120
    h: 15
    angle: -0.4
  - id: obstacle-pipe-e2
    x: 300
    y: -138
    w: 300
    h: 15
    angle: -0.4
  - id: obstacle-pipe-e3
    x: 550
    y: -225
    w: 300
    h: 15
    angle: -0.4

  # === Pumping Station A (western side) ===
  - id: obstacle-station-a-main
    x: -500
    y: 200
    w: 140
    h: 100
    angle: 0
  - id: obstacle-station-a-tank
    x: -480
    y: 80
    w: 60
    h: 60
    angle: 0
  - id: obstacle-station-a-shed
    x: -560
    y: 120
    w: 80
    h: 50
    angle: 0

  # === Pumping Station B (eastern side) ===
  - id: obstacle-station-b-main
    x: 500
    y: -200
    w: 140
    h: 100
    angle: 0
  - id: obstacle-station-b-tank
    x: 520
    y: -320
    w: 60
    h: 60
    angle: 0
  - id: obstacle-station-b-shed
    x: 560
    y: -120
    w: 80
    h: 50
    angle: 0

  # === Valve Station 1 ===
  - id: obstacle-valve1-enclosure
    x: -250
    y: 100
    w: 50
    h: 50
    angle: 0
  - id: obstacle-valve1-control
    x: -280
    y: 160
    w: 30
    h: 30
    angle: 0

  # === Valve Station 2 ===
  - id: obstacle-valve2-enclosure
    x: 250
    y: -100
    w: 50
    h: 50
    angle: 0
  - id: obstacle-valve2-control
    x: 280
    y: -40
    w: 30
    h: 30
    angle: 0

  # === Access road barriers ===
  - id: obstacle-barrier1
    x: -600
    y: 350
    w: 100
    h: 15
    angle: 0
  - id: obstacle-barrier2
    x: -500
    y: 380
    w: 80
    h: 15
    angle: 0.3

  # === Maintenance buildings ===
  - id: obstacle-maint1
    x: -350
    y: 300
    w: 80
    h: 60
    angle: 0
  - id: obstacle-maint2
    x: 350
    y: -300
    w: 80
    h: 60
    angle: 0

  # === Equipment and debris near rupture ===
  - id: obstacle-debris1
    x: -50
    y: 50
    w: 40
    h: 30
    angle: 0.5
  - id: obstacle-debris2
    x: 50
    y: -80
    w: 35
    h: 25
    angle: -0.7
  - id: obstacle-debris3
    x: 10
    y: -100
    w: 30
    h: 30
    angle: 0.3
  - id: obstacle-excavator
    x: -100
    y: -80
    w: 70
    h: 50
    angle: 0.8

  # === Storage containers (near stations) ===
  - id: obstacle-container1
    x: -550
    y: 320
    w: 60
    h: 25
    angle: 0
  - id: obstacle-container2
    x: -550
    y: 360
    w: 60
    h: 25
    angle: 0
  - id: obstacle-container3
    x: 550
    y: -80
    w: 60
    h: 25
    angle: 0

  # === Fence sections ===
  - id: obstacle-fence1
    x: -400
    y: 400
    w: 200
    h: 8
    angle: 0
  - id: obstacle-fence2
    x: 400
    y: -400
    w: 200
    h: 8
    angle: 0

gasNodes:
  # Main rupture leak - large plume
  - id: gas-rupture
    x: 0
    y: -10
    radius: 280
    peak: 3.5

  # Secondary leak from damaged valve station 1
  - id: gas-valve1
    x: -250
    y: 100
    radius: 120
    peak: 1.2
