<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gas Simulator</title>
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #141621;
        --accent: #22d3ee;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: radial-gradient(circle at 20% 20%, #1b1f2a, var(--bg));
        color: var(--text);
        min-height: 100vh;
        padding: 18px;
      }
      canvas {
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .sidebar {
        position: fixed;
        top: 18px;
        right: 18px;
        width: 320px;
        background: var(--panel);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        max-height: calc(100vh - 36px);
        overflow-y: auto;
      }
      .map-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .map-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .map-name-label {
        font-size: 14px;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 8px 12px;
        background: rgba(34, 211, 238, 0.08);
        border-radius: 8px;
        border: 1px solid rgba(34, 211, 238, 0.2);
      }
      .mode-label {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      button {
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }
      button.is-active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.5), 0 0 18px rgba(34, 211, 238, 0.2);
      }
      .agent-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .agent-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .agent-controls .full-width {
        grid-column: 1 / -1;
      }
      .gas-readout {
        font-size: 18px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.3);
      }
      .json-state-display {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .json-entry {
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(34, 211, 238, 0.05);
        border: 1px solid rgba(34, 211, 238, 0.2);
        font-family: inherit;
      }
      .json-key {
        color: var(--accent);
        font-weight: 700;
      }
      .json-value {
        color: var(--text);
      }
      .toast-container {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 1000;
        pointer-events: none;
        align-items: center;
      }
      .toast {
        background: var(--panel);
        color: var(--text);
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        animation: toast-in 0.3s ease-out;
        max-width: 80vw;
        text-align: center;
      }
      .toast.toast-out {
        animation: toast-out 0.3s ease-in forwards;
      }
      .toast-info {
        border-color: rgba(34, 211, 238, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(34, 211, 238, 0.25);
      }
      .toast-success {
        border-color: rgba(74, 222, 128, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(74, 222, 128, 0.25);
      }
      .toast-warning {
        border-color: rgba(251, 191, 36, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(251, 191, 36, 0.25);
      }
      .toast-alert {
        border-color: rgba(239, 68, 68, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(239, 68, 68, 0.3);
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(-12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes toast-out {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-12px); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script type="module" src="./main.js"></script>
  </body>
</html>
