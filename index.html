<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gas Simulator</title>
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #141621;
        --accent: #22d3ee;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: radial-gradient(circle at 20% 20%, #1b1f2a, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }
      #app {
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        padding: 18px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(420px, 1fr) 320px;
        gap: 18px;
        width: 100%;
      }
      .left-panel {
        background: #0c0f16;
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: stretch;
        justify-content: center;
      }
      .right-panel {
        background: var(--panel);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .map-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .map-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .mode-label {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      button {
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }
      button.is-active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.5), 0 0 18px rgba(34, 211, 238, 0.2);
      }
      .agent-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .agent-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .agent-controls .full-width {
        grid-column: 1 / -1;
      }
      .gas-readout {
        font-size: 18px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.3);
      }
      canvas {
        border-radius: 12px;
        width: 100%;
        height: auto;
      }
      @media (max-width: 860px) {
        #app {
          padding: 12px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .right-panel {
          order: -1;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
