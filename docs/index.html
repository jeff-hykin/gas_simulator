<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gas Simulator</title>
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #141621;
        --accent: #22d3ee;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: radial-gradient(circle at 20% 20%, #1b1f2a, var(--bg));
        color: var(--text);
        min-height: 100vh;
        padding: 18px;
      }
      canvas {
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .sidebar {
        position: fixed;
        top: 18px;
        right: 18px;
        width: 320px;
        background: var(--panel);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        max-height: calc(100vh - 36px);
        overflow-y: auto;
      }
      .map-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .map-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .map-name-label {
        font-size: 14px;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 8px 12px;
        background: rgba(34, 211, 238, 0.08);
        border-radius: 8px;
        border: 1px solid rgba(34, 211, 238, 0.2);
      }
      .mode-label {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      button {
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }
      button.is-active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.5), 0 0 18px rgba(34, 211, 238, 0.2);
      }
      .agent-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .agent-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .agent-controls .full-width {
        grid-column: 1 / -1;
      }
      .gas-readout {
        font-size: 18px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.3);
      }
      .json-state-display {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .json-entry {
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(34, 211, 238, 0.05);
        border: 1px solid rgba(34, 211, 238, 0.2);
        font-family: inherit;
      }
      .json-key {
        color: var(--accent);
        font-weight: 700;
      }
      .json-value {
        color: var(--text);
      }
      .toast-container {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 1000;
        pointer-events: none;
        align-items: center;
      }
      .toast {
        background: var(--panel);
        color: var(--text);
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        animation: toast-in 0.3s ease-out;
        max-width: 80vw;
        text-align: center;
      }
      .toast.toast-out {
        animation: toast-out 0.3s ease-in forwards;
      }
      .toast-info {
        border-color: rgba(34, 211, 238, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(34, 211, 238, 0.25);
      }
      .toast-success {
        border-color: rgba(74, 222, 128, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(74, 222, 128, 0.25);
      }
      .toast-warning {
        border-color: rgba(251, 191, 36, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(251, 191, 36, 0.25);
      }
      .toast-alert {
        border-color: rgba(239, 68, 68, 0.6);
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), 0 0 18px rgba(239, 68, 68, 0.3);
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(-12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes toast-out {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-12px); }
      }
    </style>

function createPubSub() {
  const subs = {};

    ;
    (subs[channel] ??= []).push(callback);
    return () => {
      const list = subs[channel];
      if (!list) return;
      const idx = list.indexOf(callback);
      if (idx !== -1) list.splice(idx, 1);
    };
  }

    for (const cb of subs[channel] ?? []) cb(data);

    subscribe,
    publish

    name,
    false
  ]));
  const unsubs = info7.inputs.map((channel) => pubsub.subscribe(channel, (data) => {
    state = {
      ...state,
      [channel]: data
    };
    const updated = {
      ...zeroUpdated,
      [channel]: true
    };
    const result = update(getTime, {
      state,
      updated,
      outputs
    });
    state = result.state;
    outputs = result.outputs;
    for (const [ch, value] of Object.entries(outputs)) {
      if (value == null) continue;
      pubsub.publish(ch, value);
    }
  }));

    for (const unsub of unsubs) unsub();
  };
}

    const startPos = getStartPosition();
    sim.startAgentLoop(mainPubSub, {
      ...agentConfig,
      startPosition: startPos,
      gasAgent: selectedGasAgent
    });
    const routes = mapSys.mapData.routes || [];
    if (routes.length > 0 && routes[0].points.length > 0) {
      mainPubSub.publish("route_update", { waypoints: routes[0].points });
    }
  }
  updateAgentButtons();
}
function pauseAgent() {
  sim.pause();
  updateAgentButtons();
}
function updateJsonStateDisplay() {
  if (!jsonStateDisplay) return;
  jsonStateDisplay.innerHTML = "";
  Object.entries(currentJsonState).forEach(([key, value]) => {
    const entry = document.createElement("div");
    entry.className = "json-entry";
    const keySpan = document.createElement("span");
    keySpan.className = "json-key";
    keySpan.textContent = key + ": ";
    const valueSpan = document.createElement("span");
    valueSpan.className = "json-value";
    valueSpan.textContent = typeof value === "object" ? JSON.stringify(value) : String(value);
    entry.appendChild(keySpan);
    entry.appendChild(valueSpan);
    jsonStateDisplay.appendChild(entry);
  });
}
function resetAgent() {
  const startPos = getStartPosition();
  sim.resetRobot({ x: startPos.x, y: startPos.y, angle: 0 });
  mainPubSub = null;
  Object.keys(currentJsonState).forEach((key) => delete currentJsonState[key]);
  updateJsonStateDisplay();
  const world = canvasSys.getWorld();
  visualizationPointsById.forEach((point) => {
    const index = world.indexOf(point);
    if (index !== -1) world.splice(index, 1);
  });
  visualizationPointsById.clear();
  for (const item of vectorFieldItems) {
    canvasSys.removeFromWorld(item);
  }
  vectorFieldItems = [];
  canvasSys.render();
  updateAgentButtons();
}
var toastContainer = document.createElement("div");
toastContainer.className = "toast-container";
document.body.append(toastContainer);
function showToast(message, type2 = "info", duration = 3e3) {
  const toast = document.createElement("div");
  toast.className = `toast toast-${type2}`;
  toast.textContent = message;
  toast.style.setProperty("--toast-duration", `${duration}ms`);
  toastContainer.append(toast);
  setTimeout(() => {
    toast.classList.add("toast-out");
    setTimeout(() => toast.remove(), 300);
  }, duration);
}
var canvasWrap = document.createElement("div");
canvasWrap.style.position = "relative";
canvasWrap.style.display = "inline-block";
canvasWrap.append(canvasSys.canvas);
var legend = document.createElement("div");
legend.className = "canvas-legend";
Object.assign(legend.style, {
  position: "absolute",
  top: "10px",
  left: "10px",
  padding: "8px 10px",
  background: "rgba(15,15,16,0.78)",
  border: "1px solid #333",
  borderRadius: "4px",
  font: "12px monospace",
  color: "#eaeaea",
  pointerEvents: "none",
  display: "flex",
  flexDirection: "column",
  gap: "4px"
});
var legendEntries = [
  { label: "agent", stroke: "#22d3ee", fill: "rgba(34,211,238,0.2)" },
  { label: "route", stroke: "#fbbf24", fill: "#fbbf24" },
  { label: "building", stroke: "#e11d48", fill: "rgba(225,29,72,0.2)" },

  { label: "smell lost point", stroke: "#22c55e", fill: "#22c55e" }
];
for (const entry of legendEntries) {
  const row = document.createElement("div");
  Object.assign(row.style, { display: "flex", alignItems: "center", gap: "8px" });
  const swatch = document.createElement("div");
  Object.assign(swatch.style, {
    width: "14px",

    border: `2px solid ${entry.stroke}`,
    background: entry.fill,
    boxSizing: "border-box"
  });
  const text = document.createElement("span");
  text.textContent = entry.label;
  row.append(swatch, text);
  legend.append(row);
}
canvasWrap.append(legend);
var layerPanel = document.createElement("div");
layerPanel.className = "canvas-layer-panel";
Object.assign(layerPanel.style, {
  position: "fixed",
  bottom: "10px",
  left: "10px",
  zIndex: "10",
  padding: "8px 10px",
  background: "rgba(15,15,16,0.78)",
  border: "1px solid #333",
  borderRadius: "4px",
  font: "12px monospace",
  color: "#eaeaea",
  display: "flex",
  flexDirection: "column",
  gap: "4px",
  userSelect: "none"
});
var layerToggles = [
  { label: "gas", layer: "gas", initial: true },
  { label: "obstacles", layer: "obstacles", initial: true },
  { label: "route", layer: "route", initial: true },
  { label: "gradient-trail", layer: "gradient-trail", initial: true }
];
for (const { label, layer, initial } of layerToggles) {
  const row = document.createElement("label");
  Object.assign(row.style, { display: "flex", alignItems: "center", gap: "6px", cursor: "pointer" });
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = initial;
  canvasSys.setLayerVisible(layer, initial);
  cb.addEventListener("change", () => canvasSys.setLayerVisible(layer, cb.checked));
  const text = document.createElement("span");
  text.textContent = label;
  row.append(cb, text);
  layerPanel.append(row);
}
document.body.append(canvasWrap);
document.body.append(layerPanel);
var sidebar = document.createElement("div");
sidebar.className = "sidebar";
var agentLabel = document.createElement("div");
agentLabel.className = "mode-label";
agentLabel.textContent = "Agent";
var agentControls = document.createElement("div");
agentControls.className = "agent-controls";
function toggleAgent() {
  if (sim.isClockRunning) {
    pauseAgent();
  } else {
    playAgent();
  }
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault();
    toggleAgent();
  }
});
var btnToggle = buildButton("Play", toggleAgent);
var btnReset = buildButton("Reset", resetAgent);
btnToggle.classList.add("full-width");
btnReset.classList.add("full-width");
var agentSelect = document.createElement("select");
agentSelect.className = "full-width";
for (const { label } of AGENT_OPTIONS) {
  const opt = document.createElement("option");
  opt.value = label;
  opt.textContent = label;
  agentSelect.append(opt);
}
agentSelect.addEventListener("change", () => {
  const chosen = AGENT_OPTIONS.find((o) => o.label === agentSelect.value);
  if (!chosen) return;
  selectedGasAgent = chosen.agent;
  if (sim.agentActive) sim.stopAgentLoop();
  mainPubSub = null;
  updateAgentButtons();
});
agentControls.append(agentSelect, btnToggle, btnReset);
var jsonStateDisplay = document.createElement("div");
jsonStateDisplay.className = "json-state-display";
sidebar.append(
  mapSys.element,
  sim.gasReadout,
  agentLabel,
  agentControls,
  jsonStateDisplay
);
document.body.append(sidebar);

fetch(defaultMap).then((response) => response.text()).then((yamlText) => {

}).catch((err) => console.warn("Could not load default map:", err));
